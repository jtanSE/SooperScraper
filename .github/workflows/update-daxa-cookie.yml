name: Update DAXA cookie

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: "Scheduled job name to update"
        required: true
        default: "DAXA"

jobs:
  update-cookie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOOPERSCRAPER_DB_URL: ${{ secrets.SOOPERSCRAPER_DB_URL }}
      SOOPERSCRAPER_SECRET_KEY: ${{ secrets.SOOPERSCRAPER_SECRET_KEY }}
      SOOPERSCRAPER_COOKIE_JOB_NAME: ${{ inputs.job_name }}
      DAXA_COOKIE_RAW: ${{ secrets.DAXA_COOKIE_RAW }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Update stored DAXA cookie
        run: python -m app.update_cookies
