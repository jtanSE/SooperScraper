name: Scheduled scrapes

on:
  repository_dispatch:
    types: [scheduled-scrapes]
  workflow_dispatch:
    inputs:
      run_all_active:
        description: "Run all active jobs now, ignoring next_run_at"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      list_jobs:
        description: "Print safe job summary instead of running scrapes"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

concurrency:
  group: scheduled-scrapes
  cancel-in-progress: false

jobs:
  run-due-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      SOOPERSCRAPER_DB_URL: ${{ secrets.SOOPERSCRAPER_DB_URL }}
      SOOPERSCRAPER_SECRET_KEY: ${{ secrets.SOOPERSCRAPER_SECRET_KEY }}
      SOOPERSCRAPER_LOG_LEVEL: INFO
      SOOPERSCRAPER_RUNNER_LOOKAHEAD_SECONDS: 180
      RUN_ALL_ACTIVE: ${{ inputs.run_all_active || github.event.client_payload.run_all_active || 'false' }}
      LIST_JOBS: ${{ inputs.list_jobs || github.event.client_payload.list_jobs || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run due scrape jobs
        run: |
          if [ "$LIST_JOBS" = "true" ]; then
            python -m app.runner --list
          elif [ "$RUN_ALL_ACTIVE" = "true" ]; then
            python -m app.runner --all
          else
            python -m app.runner
          fi
