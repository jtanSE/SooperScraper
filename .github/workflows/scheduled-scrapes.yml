name: Scheduled scrapes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-scrapes
  cancel-in-progress: false

jobs:
  run-due-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOOPERSCRAPER_DB_URL: ${{ secrets.SOOPERSCRAPER_DB_URL }}
      SOOPERSCRAPER_SECRET_KEY: ${{ secrets.SOOPERSCRAPER_SECRET_KEY }}
      SOOPERSCRAPER_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run due scrape jobs
        run: python -m app.runner
